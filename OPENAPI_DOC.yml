  /auth/failure:
    summary: OAuth / SAML callback failure landing page. OmniAuth (Ruby) and
    description: 'OAuth / SAML callback failure landing page. OmniAuth (Ruby) and

      `multi_auth` (Crystal) bounce here when a provider rejects the

      authentication round-trip; the page just tells the user it didn''t

      work and lets the front-end''s framing decide what to do next.'
    get:
      summary: 'NB: 200 OK, not 401 — matches the Ruby service so any client'
      description: 'NB: 200 OK, not 401 — matches the Ruby service so any client

        automation that hard-codes `if response.status == 200` keeps

        working at cutover. The status doesn''t carry semantics for any

        caller; the body content is what counts.'
      tags:
      - Failures
      operationId: PlaceOS::Auth::Failures_show
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
