  /auth/token:
    summary: OAuth 2.0 / OpenID Connect server endpoints. Wraps the `authly`
    description: 'OAuth 2.0 / OpenID Connect server endpoints. Wraps the `authly`

      shard''s library API (we don''t mount `Authly::Handler` because we

      want the legacy `/auth/...` prefix, not `/oauth/...`).


      Every endpoint is served at both the short `/auth/*` path and the

      legacy Doorkeeper `/auth/oauth/*` mount point (stacked route

      annotations), so the service is a drop-in for the Rails auth.'
    post:
      summary: '`/auth/oauth/token` is the legacy Doorkeeper mount point; kept as
        an'
      description: '`/auth/oauth/token` is the legacy Doorkeeper mount point; kept
        as an

        alias so clients that hardcode the documented path keep working.'
      tags:
      - OAuth
      operationId: PlaceOS::Auth::OAuth_token
      parameters:
      - name: grant_type
        in: query
        required: true
