          type: string
        email_domains:
          type: array
          items:
            type: string
        config:
          type: object
          additionalProperties:
            type: object
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: "null"
        version:
          type: string
        production:
          type: boolean
        session:
          type: boolean
        token_valid:
          type: boolean
      required:
      - name
      - description
      - domain
      - login_url
      - logout_url
      - email_domains
      - config
      - version
      - production
      - session
      - token_valid
      description: 'JSON payload returned for a recognised authority. Mirrors the
        Ruby

        `authority.as_json(except: [created_at, internals])` plus the

        `session` / `token_valid` / `production` / `version` decorations.'
    PlaceOS.Auth.AuthorizedApplications.Summary:
      type: object
      properties:
        id:
          type: integer
          format: Int64
        name:
          type: string
        uid:
          anyOf:
          - type: "null"
          - type: string
      required:
      - id
      - name
      description: 'Public application shape — the non-owner view (id, name, created_at,

        plus uid for non-confidential apps).'
    PlaceOS.Auth.OAuth.TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: Int64
        created_at:
          type: integer
          format: Int64
        refresh_token:
          anyOf:
          - type: "null"
          - type: string
        scope:
          anyOf:
          - type: "null"
          - type: string
        id_token:
          anyOf:
          - type: "null"
          - type: string
        issued_token_type:
          anyOf:
          - type: "null"
          - type: string
      required:
      - access_token
      - token_type
      - expires_in
      - created_at
      description: 'Standard OAuth token response. We don''t serialise Authly''s

        `AccessToken` directly because it leaks the `sub` claim and the

        `jti` into the public response.'
    PlaceOS.Auth.OAuth.IntrospectionResponse:
      type: object
      properties:
        active:
          type: boolean
        scope:
          anyOf:
          - type: "null"
          - type: string
        client_id:
          anyOf:
          - type: "null"
          - type: string
        token_type:
          anyOf:
          - type: "null"
          - type: string
        iat:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
        exp:
          anyOf:
          - type: integer
            format: Int64
          - type: "null"
      required:
      - active
      description: 'OAuth2 token introspection. The Ruby service (Doorkeeper) required

        the *caller* to authenticate — either with client credentials

        (HTTP Basic or `client_id`/`client_secret` params) or with a

        different bearer access token — and only revealed a token''s state

        to the client that owns it. We reproduce that: an unauthenticated

        introspection endpoint would leak token validity to anyone.'
    PlaceOS.Auth.OAuth.TokenInfoResponse:
      type: object
      properties:
        resource_owner_id:
          type: string
        scope:
          type: array
          items:
            type: string
        expires_in:
          type: integer
          format: Int64
        application:
          $ref: '#/components/schemas/PlaceOS.Auth.OAuth.TokenInfoResponse.Application'
        created_at:
          type: integer
          format: Int64
      required:
      - resource_owner_id
      - scope
      - expires_in
      - application
      - created_at
      description: 'Returns metadata about the presented bearer access token, matching

        Doorkeeper''s `token_info#show` shape.'
    PlaceOS.Auth.Discovery.Response:
      type: object
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        revocation_endpoint:
          type: string
        end_session_endpoint:
          anyOf:
          - type: "null"
          - type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
        jwks_uri:
          type: string
        introspection_endpoint:
          type: string
        registration_endpoint:
          type: string
        client_id_metadata_document_supported:
          type: boolean
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - userinfo_endpoint
      - revocation_endpoint
      - scopes_supported
      - response_types_supported
      - grant_types_supported
      - subject_types_supported
      - id_token_signing_alg_values_supported
      - token_endpoint_auth_methods_supported
      - code_challenge_methods_supported
      - claims_supported
      - jwks_uri
      - introspection_endpoint
      - registration_endpoint
      - client_id_metadata_document_supported
      description: See `OAuth` for the rest of the OAuth2/OIDC surface area.
    PlaceOS.Auth.Discovery.ProtectedResource:
      type: object
      properties:
        resource:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        bearer_methods_supported:
          type: array
          items:
            type: string
      required:
      - resource
      - authorization_servers
      - scopes_supported
      - bearer_methods_supported
      description: 'RFC 9728 OAuth protected resource metadata, for the resource servers
        on

        this host. nginx routes `/.well-known/*` here, so this is served on their

        behalf, e.g. rest-api''s MCP endpoint at

        `/.well-known/oauth-protected-resource/api/engine/v2/mcp`. MCP clients

        follow it to discover this authorization server.'
    PlaceOS.Auth.Discovery.WebFingerResponse:
      type: object
      properties:
        subject:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/PlaceOS.Auth.Discovery.WebFingerLink'
      required:
      - subject
      - links
    PlaceOS.Auth.Discovery.KeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PlaceOS.Auth.JWKS.Key'
      required:
      - keys
      description: 'JWKS (RFC 7517) — the verification key for our RS256 tokens, at

        Doorkeeper-openid_connect''s mount point. Derived from the same key

        `JWT_SECRET` configures for signing.'
    PlaceOS.Auth.Registrations.ClientMetadata:
      type: object
      properties:
        redirect_uris:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
        client_name:
          anyOf:
          - type: "null"
          - type: string
        token_endpoint_auth_method:
          anyOf:
          - type: "null"
          - type: string
        grant_types:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
        response_types:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
        scope:
          anyOf:
          - type: "null"
          - type: string
      description: RFC 7591 §2 client metadata
    PlaceOS.Auth.Registrations.ClientInformation:
      type: object
      properties:
        client_id:
          type: string
        client_id_issued_at:
          type: integer
          format: Int64
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
        scope:
          type: string
      required:
      - client_id
      - client_id_issued_at
      - client_name
      - redirect_uris
      - grant_types
      - response_types
      - token_endpoint_auth_method
      - scope
      description: RFC 7591 §3.2.1 client information response
    PlaceOS.Auth.Sessions.SigninBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        continue:
          anyOf:
          - type: "null"
          - type: string
      required:
      - email
      - password
    PlaceOS.Auth.Application.CommonError:
      type: object
      properties:
        error:
          anyOf:
          - type: "null"
          - type: string
        backtrace:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
      description: 'Generic JSON error payload. Same shape as rest-api so clients

        don''t need to branch on which service responded.'
    PlaceOS.Auth.Application.ValidationError:
      type: object
      properties:
        error:
          type: string
        failures:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
            required:
            - field
            - reason
      required:
      - error
      - failures
    PlaceOS.Auth.Application.ContentError:
      type: object
      properties:
        error:
          type: string
        accepts:
          anyOf:
          - type: "null"
          - type: array
            items:
              type: string
      required:
      - error
    PlaceOS.Auth.Application.ParameterError:
      type: object
      properties:
        error:
          type: string
        parameter:
          anyOf:
          - type: "null"
          - type: string
        restriction:
          anyOf:
          - type: "null"
          - type: string
      required:
      - error
    PlaceOS.Auth.OAuth.ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_description:
          anyOf:
          - type: "null"
          - type: string
      required:
      - error
      description: 'OAuth-standard error envelope (RFC 6749 §5.2). HTTP status is

        carried separately on the response.'
    PlaceOS.Auth.Registrations.RegistrationError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
      required:
      - error
      - error_description
      description: RFC 7591 §3.2.2 error response
    PlaceOS.Auth.OAuth.TokenInfoResponse.Application:
      type: object
      properties:
        uid:
          anyOf:
          - type: "null"
          - type: string
    PlaceOS.Auth.Discovery.WebFingerLink:
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
      required:
      - rel
      - href
      description: 'OIDC discovery §2: WebFinger. The legacy service echoed the

        `resource` parameter back untouched with a single issuer link;

        requests without `resource` fail with 400.'
    PlaceOS.Auth.JWKS.Key:
      type: object
      properties:
        kty:
          type: string
        n:
          type: string
        e:
          type: string
        kid:
          type: string
        use:
          type: string
        alg:
          type: string
      required:
      - kty
      - n
      - e
      - kid
      - use
      - alg
    -oPlaceOS.Auth.Authorities.AuthorityResponse-pNil-c:
      anyOf:
      - $ref: '#/components/schemas/PlaceOS.Auth.Authorities.AuthorityResponse'
      - type: "null"
    String:
      type: string
    Hash-oString-nInt64-pString-c:
      type: object
      additionalProperties:
        anyOf:
        - type: integer
          format: Int64
        - type: string
    NamedTuple-ostatus-u00003A-u000020String-napp-u00003A-u000020String-nversion-u00003A-u000020String-c:
      type: object
      properties:
        status:
          type: string
        app:
          type: string
        version:
          type: string
      required:
      - status
      - app
      - version
    NamedTuple-oerrors-u00003A-u000020Array-oString-c-c:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
      - errors
    NamedTuple-oerror-u00003A-u000020String-nerror_description-u00003A-u000020String-pNil-c:
      type: object
      properties:
        error:
