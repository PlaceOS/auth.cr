  /auth/register:
    summary: OAuth 2.0 Dynamic Client Registration (RFC 7591).
    description: 'OAuth 2.0 Dynamic Client Registration (RFC 7591).


      Lets MCP clients (and other native or browser apps) register themselves

      without an administrator. Only public clients are accepted: they hold no

      secret, must use PKCE (S256) and every authorization they request is shown

      to the user on a consent screen.


      A public client''s registration is just its metadata, so a request matching
      an

      existing registration (same client name and redirect URIs) returns that

      client. Every user of a client such as Claude or ChatGPT shares one

      registration. Only new client identities count towards `MCP_REGISTRATION_LIMIT`

      per hour. That''s a global limit: hosted clients register from shared IPs, so
      a

      per-IP limit would refuse their users.'
    post:
      summary: Registers a public client.
      tags:
      - Registrations
      operationId: PlaceOS::Auth::Registrations_register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOS.Auth.Registrations.ClientMetadata'
          application/x-www-form-urlencoded:
            schema:
              type: string
              format: binary
        required: true
      parameters: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOS.Auth.Registrations.ClientInformation'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
