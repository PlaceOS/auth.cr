  /auth/authority:
    summary: Mirrors `Auth::AuthoritiesController#current` from the Ruby service.
    description: 'Mirrors `Auth::AuthoritiesController#current` from the Ruby service.

      Doubles as a health probe: when `?health` is set on the query string

      we always return 200 OK, so upstream load balancers can hit this

      endpoint regardless of which host header they send.'
    get:
      tags:
      - Authorities
      operationId: PlaceOS::Auth::Authorities_current
      parameters:
      - name: health
        in: query
        description: respond 200 OK without querying the database; used as a liveness
          probe
        schema:
          anyOf:
          - type: "null"
          - type: string
      responses:
        "200":
          description: OK
          content:
