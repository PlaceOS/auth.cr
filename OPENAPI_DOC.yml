    summary: 'External-IdP round-trip handlers. Two routes per provider:'
    description: "External-IdP round-trip handlers. Two routes per provider:\n\n  *
      GET  `/auth/:provider`            — kickoff: build redirect_uri,\n                                        look
      up the strat, store the\n                                        CSRF state,
      redirect to the IdP.\n  * GET  `/auth/:provider/callback`   — consume: validate
      state, ask\n                                        multi_auth to exchange code\n
